<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card Studio · 交互设计实验</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f1eb;color:#233b39;font:16px/1.6 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:36px 24px}h1{font-size:36px;line-height:1.2;margin:8px 0 12px}h2{font-size:18px;margin:0 0 16px}p{margin:0 0 18px}.eyebrow{letter-spacing:.16em;color:#516b55;font-size:12px}.subtle{color:#60716c}.workspace{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;margin-top:28px}aside,.preview-panel,.prompt-panel{border:1px solid #ccd4c9;border-radius:16px;padding:24px;background:#fffef9}.preview-panel{background:#e2e9de;display:grid;place-items:center;min-height:420px}.right{min-width:0;display:grid;gap:24px}label{display:block;font-size:14px;font-weight:600;margin-top:18px}input[type=text]{width:100%;border:1px solid #a4b4a8;border-radius:8px;padding:10px;font:inherit;background:#fffef9;color:#233b39}input[type=range]{width:100%;accent-color:#32674e}input[type=color]{display:block;margin:8px 0;width:100%;height:38px;border:1px solid #a4b4a8;background:white}input[type=checkbox]{accent-color:#32674e}button{font:inherit;border:1px solid #9dac9f;border-radius:8px;padding:8px 12px;background:#fffef9;color:#233b39;cursor:pointer}button:hover{background:#e5ecdf}button[aria-pressed=true],button.primary{background:#233b39;color:white}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #c29b43;outline-offset:3px}.presets{display:flex;gap:6px;flex-wrap:wrap}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}#preview{width:min(100%,370px);background:#fffef9;border:1px solid #cbd6c8;overflow-wrap:anywhere}#preview h3{font-size:26px;line-height:1.25;margin:14px 0}#preview .badge{display:inline-block;border-radius:20px;font-size:12px;letter-spacing:.1em;border:1px solid;padding:3px 9px}#preview .accent{height:6px;width:48px;border-radius:4px}#preview .link{font-weight:700;text-decoration:underline;text-underline-offset:5px}#prompt{display:block;width:100%;min-height:108px;resize:vertical;border:1px solid #bccabd;border-radius:8px;background:#f5f6ef;padding:12px;font:14px/1.7 system-ui;color:#233b39}#feedback{margin-top:10px;min-height:24px;font-size:14px}.heading{display:flex;align-items:baseline;gap:14px;justify-content:space-between}output{font-variant-numeric:tabular-nums;font-weight:400;float:right}@media(max-width:740px){main{padding:24px 14px}h1{font-size:30px}.workspace{grid-template-columns:1fr}.preview-panel{min-height:330px}aside,.preview-panel,.prompt-panel{padding:20px}}
</style></head><body><main><span class="eyebrow">CARD STUDIO / COTREE</span><h1>把想法，调成你喜欢的样子。</h1><p class="subtle">调整卡片的留白、轮廓与色彩，实时预览并带走清晰的设计说明。</p>
<div class="workspace"><aside><h2>设计控制台</h2><div class="presets" aria-label="风格预设"><button data-preset="calm" aria-pressed="true">舒展</button><button data-preset="bold" aria-pressed="false">鲜明</button><button data-preset="compact" aria-pressed="false">紧凑</button></div>
<label for="title">卡片标题</label><input id="title" type="text" maxlength="120" value="留一点空间，给新的灵感。">
<label for="radius">圆角 <output id="radius-value" for="radius">16 px</output></label><input id="radius" type="range" min="0" max="40" step="1" value="16">
<label for="padding">留白 <output id="padding-value" for="padding">28 px</output></label><input id="padding" type="range" min="12" max="48" step="1" value="28">
<label for="accent">强调色</label><input id="accent" type="color" value="#32674e">
<label><input id="shadow" type="checkbox" checked> 添加轻柔阴影</label><div class="actions"><button id="reset">恢复默认</button></div></aside>
<div class="right"><section class="preview-panel" aria-label="实时卡片预览"><article id="preview"><div class="accent"></div><span class="badge">FIELD NOTES / 01</span><h3 id="preview-title">留一点空间，给新的灵感。</h3><p class="subtle">记录一个小观察，把它变成下一次创作的起点。</p><span class="link">开始记录 →</span></article></section>
<section class="prompt-panel"><div class="heading"><h2><label for="prompt" style="margin:0;font-size:18px">设计说明</label></h2><span class="subtle">随调整更新</span></div><textarea id="prompt" readonly spellcheck="false"></textarea><div class="actions"><button class="primary" id="copy">复制说明</button><button id="export">导出此页面</button></div><div id="feedback" role="status" aria-live="polite"></div></section></div></div></main>
<script type="application/json" id="saved-state">null</script>
<script>
(() => {
  const defaults={title:'留一点空间，给新的灵感。',radius:16,padding:28,accent:'#32674e',shadow:true};
  const presets={calm:{radius:16,padding:28,accent:'#32674e',shadow:true},bold:{radius:4,padding:32,accent:'#9b4626',shadow:false},compact:{radius:8,padding:16,accent:'#345b84',shadow:false}};
  const fields=Object.fromEntries(Object.keys(defaults).map(key=>[key,document.getElementById(key)]));
  const preview=document.getElementById('preview'), prompt=document.getElementById('prompt'), feedback=document.getElementById('feedback');
  let state={...defaults};
  try{const saved=JSON.parse(document.getElementById('saved-state').textContent);if(saved && typeof saved==='object'){if(typeof saved.title==='string')state.title=saved.title.slice(0,120);for(const [key,min,max] of [['radius',0,40],['padding',12,48]])if(Number.isFinite(saved[key]))state[key]=Math.round(Math.max(min,Math.min(max,saved[key])));if(/^#[0-9a-f]{6}$/i.test(saved.accent))state.accent=saved.accent;if(typeof saved.shadow==='boolean')state.shadow=saved.shadow;}}catch{feedback.textContent='保存的数据无法解析，已使用默认设置。';}
  function render(){
    for(const [key,input] of Object.entries(fields)){if(key==='shadow')input.checked=state[key];else input.value=state[key];}
    preview.style.borderRadius=state.radius+'px';preview.style.padding=state.padding+'px';preview.style.boxShadow=state.shadow?'0 16px 36px rgba(35,59,57,.12)':'none';
    document.getElementById('preview-title').textContent=state.title;
    preview.querySelector('.accent').style.backgroundColor=state.accent;preview.querySelector('.badge').style.color=state.accent;preview.querySelector('.link').style.color=state.accent;
    for(const key of ['radius','padding'])document.getElementById(key+'-value').textContent=state[key]+' px';
    for(const button of document.querySelectorAll('[data-preset]'))button.setAttribute('aria-pressed',String(Object.entries(presets[button.dataset.preset]).every(([key,value])=>state[key]===value)));
    const changes=[];if(state.radius!==defaults.radius)changes.push('圆角改为 '+state.radius+'px');if(state.padding!==defaults.padding)changes.push('内边距改为 '+state.padding+'px');if(state.accent!==defaults.accent)changes.push('强调色使用 '+state.accent);if(!state.shadow)changes.push('去掉阴影');
    prompt.value='设计一张浅色笔记卡片，标题为“'+state.title+'”。默认采用 16px 圆角、28px 内边距、深绿色 #32674e 与轻柔阴影。'+(changes.length?'在此基础上，'+changes.join('，')+'。':'保留默认样式。')+'保持正文可读，窄屏自适应。';
  }
  for(const [key,input] of Object.entries(fields))input.addEventListener('input',()=>{state={...state,[key]:key==='shadow'?input.checked:key==='radius'||key==='padding'?Number(input.value):input.value};render();feedback.textContent='';});
  for(const button of document.querySelectorAll('[data-preset]'))button.addEventListener('click',()=>{state={...state,...presets[button.dataset.preset]};render();feedback.textContent='';});
  document.getElementById('reset').addEventListener('click',()=>{state={...defaults};render();feedback.textContent='已恢复默认设置。';});
  document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(prompt.value);feedback.textContent='设计说明已复制。';}catch{prompt.focus();prompt.select();feedback.textContent='浏览器未允许自动复制，文字已选中，请按 Ctrl/Cmd+C。';}});
  document.getElementById('export').addEventListener('click',()=>{const clone=document.documentElement.cloneNode(true);clone.querySelector('#saved-state').textContent=JSON.stringify(state).replaceAll('<','\\u003c');clone.querySelector('#feedback').textContent='';const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='card-studio.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);feedback.textContent='已发起页面下载；重新打开可继续调整。';});
  render();
})();
</script></body></html>
