<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Message preview</title>
<style>
:root{font-family:system-ui,sans-serif;color:#182334;background:#f3f5f8;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:620px;margin:auto;background:white;padding:28px;border:1px solid #d9e1ea;border-radius:14px}h1{font-size:24px;margin:0 0 12px}p{line-height:1.6}label{display:block;font-weight:600;margin-top:24px}textarea{font:inherit;width:100%;padding:12px;margin:8px 0;border:1px solid #8b98a9;border-radius:6px;resize:vertical}button{font:inherit;padding:10px 18px;background:#164ab5;color:white;border:0;border-radius:6px}button:disabled{opacity:.5}button:focus-visible,textarea:focus-visible{outline:3px solid #809dff;outline-offset:3px}output{display:block;white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:#f0f5ff;border-radius:6px;min-height:64px}#status{font-size:14px;color:#46576e}@media(max-width:450px){body{padding:12px}main{padding:18px}}
</style></head><body><main><h1>Message preview</h1><p>Display a message through the app’s tool. This example does not save or send your text.</p><form><label for="message">Your message</label><textarea id="message" rows="3" required maxlength="1000">Hello from the widget</textarea><button id="show" disabled>Display message</button></form><p id="status" role="status">Connecting to host…</p><h2>Tool result</h2><output id="result" aria-live="polite">Waiting for a tool result.</output></main><script type="module">/* BUNDLED_WIDGET */</script></body></html>
