<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumen Trail · 微光收集</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a181d;color:#e4efe8;font:16px/1.6 system-ui,sans-serif}main{max-width:920px;margin:32px auto;padding:0 24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:32px;margin:4px 0}.eyebrow{color:#94e9bb;letter-spacing:.16em;font-size:12px}p{color:#b0c2bc;margin:8px 0}button{background:#213b41;color:#e4efe8;border:1px solid #496266;border-radius:8px;padding:10px 18px;cursor:pointer;font:inherit}button:hover{background:#305059}button:focus-visible,#playfield:focus-visible{outline:3px solid #c9f78c;outline-offset:4px}#playfield{margin:20px 0;border:1px solid #496266;border-radius:12px;overflow:hidden;aspect-ratio:5/3}canvas{display:block;width:100%!important;height:100%!important}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#score{font-size:22px;white-space:nowrap}.controls{display:flex;gap:8px;margin:18px 0}#status{color:#c9f78c;min-height:26px}@media(max-width:540px){main{margin:18px auto;padding:0 14px}h1{font-size:24px}.controls{justify-content:center}.controls button{padding:10px 16px}header{align-items:flex-start}}
</style></head><body><main><header><div><span class="eyebrow">LUMEN TRAIL / 01</span><h1>循着微光前进</h1></div><output id="score" aria-label="已收集微光">0 / 3</output></header>
<p>收集三枚微光，点亮这片小小的夜色。</p><div id="playfield" tabindex="0" role="group" aria-label="游戏区域，方向键或 WASD 移动"></div>
<div class="toolbar"><button id="pause" type="button" aria-pressed="false">暂停</button><button id="restart" type="button">重新开始</button><span id="status" role="status">用方向键、WASD 或下方按钮移动</span></div>
<div class="controls" aria-label="移动方向"><button data-move="left" aria-label="向左">←</button><button data-move="up" aria-label="向上">↑</button><button data-move="down" aria-label="向下">↓</button><button data-move="right" aria-label="向右">→</button></div>
<p>点击游戏区域后即可使用键盘。暂停时移动无效；随时可以重新开始。</p></main>
<script src="node_modules/phaser/dist/phaser.min.js"></script><script type="module" src="main.mjs"></script></body></html>
